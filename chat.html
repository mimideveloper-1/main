<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <meta
        name="description"
        content="Chat - real-time multi-user chat rooms.">

    <meta
        name="theme-color"
        content="#000000">

    <link
        rel="icon"
        type="image/png"
        href="https://th.bing.com/th/id/ODF.cCsv-cCt-jkEcwiJYMYj4A?w=32&h=32&qlt=90&pcl=fffffc&o=6&pid=1.2">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Grandstander:ital,wght@0,100..900;1,100..900&family=Jersey+10&family=Lexend:wght@100..900&display=swap"
        rel="stylesheet">

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

        }


        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {

            --accent1: #9b59b6;
            --accent2: #c084fc;

            --theme-bg1: #000000;
            --theme-bg2: #b700ff;

        }


        /* =========================================================
           BODY
        ========================================================= */

        body {

            font-family:
                "Lexend",
                sans-serif;

            overflow: hidden;

            color: white;

            cursor:
                url("/cursor/Arrow.cur"),
                auto;

            background:
                linear-gradient(
                    135deg,
                    var(--theme-bg1),
                    var(--theme-bg2)
                );

        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        #bg {

            position: fixed;

            inset: 0;

            z-index: -10;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    var(--theme-bg1),
                    var(--theme-bg2)
                );

        }


        #bg::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.214);

            pointer-events: none;

            z-index: 2;

        }


        /* =========================================================
           CHAT LAYOUT
        ========================================================= */

        #chatShell {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            display: flex;

            gap: 14px;

            padding:
                14px
                14px
                14px
                104px;

            box-sizing: border-box;

            z-index: 5;

        }


        /* =========================================================
           SIDEBAR (rooms)
        ========================================================= */

        .rooms-panel {

            width: 240px;

            flex: 0 0 auto;

            display: flex;

            flex-direction: column;

            gap: 10px;

            padding: 14px;

            box-sizing: border-box;

            border-radius: 16px;

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 14%,
                    rgba(10, 10, 14, 0.78)
                );

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    rgba(255,255,255,0.10)
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                0 14px 40px rgba(0,0,0,0.28),
                0 0 24px color-mix(in srgb, var(--accent1) 16%, transparent);

        }


        .rooms-title {

            font-family: "Grandstander", cursive;

            font-size: 22px;

            letter-spacing: -0.5px;

            color: white;

            margin:
                0
                0
                6px;

            text-shadow:
                0 0 18px color-mix(in srgb, var(--accent1) 32%, transparent);

        }


        .rooms-list {

            display: flex;

            flex-direction: column;

            gap: 6px;

            overflow-y: auto;

            flex: 1 1 auto;

            padding-right: 2px;

        }


        .room-item {

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                10px
                12px;

            border-radius: 11px;

            border: none;

            background: transparent;

            color:
                rgba(255,255,255,0.72);

            font-family: "Lexend", sans-serif;

            font-size: 13px;

            text-align: left;

            cursor: url("/cursor/Hand.cur"), pointer;

            transition: 0.18s ease;

        }


        .room-item:hover {

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 18%,
                    rgba(255,255,255,0.05)
                );

            color: white;

        }


        .room-item.is-active {

            background:
                linear-gradient(
                    135deg,
                    color-mix(in srgb, var(--accent1) 25%, transparent),
                    color-mix(in srgb, var(--accent2) 25%, transparent)
                );

            color: white;

            box-shadow:
                0 0 18px color-mix(in srgb, var(--accent1) 22%, transparent);

        }


        .room-hash {

            font-family: "Jersey 10", monospace;

            font-size: 20px;

            color: var(--accent2);

            line-height: 1;

            flex: 0 0 auto;

        }


        .room-name {

            flex: 1 1 auto;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .room-badge {

            font-family: "Jersey 10", monospace;

            font-size: 14px;

            color: rgba(255,255,255,0.5);

            flex: 0 0 auto;

        }


        .room-add {

            display: flex;

            gap: 6px;

            margin-top: 4px;

        }


        .room-add input {

            flex: 1 1 auto;

            min-width: 0;

            padding:
                8px
                10px;

            border-radius: 9px;

            border: 1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 26%,
                    rgba(255,255,255,0.10)
                );

            background: rgba(0,0,0,0.35);

            color: white;

            font-family: "Lexend", sans-serif;

            font-size: 12px;

            outline: 0;

        }


        .room-add input::placeholder {

            color: rgba(255,255,255,0.4);

        }


        .room-add button {

            padding:
                8px
                12px;

            border-radius: 9px;

            border: none;

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    rgba(255,255,255,0.06)
                );

            color: white;

            font-family: "Lexend", sans-serif;

            font-size: 12px;

            cursor: url("/cursor/Hand.cur"), pointer;

            transition: 0.18s ease;

        }


        .room-add button:hover {

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 55%,
                    rgba(255,255,255,0.10)
                );

        }


        /* =========================================================
           MAIN CHAT PANEL
        ========================================================= */

        .chat-panel {

            flex: 1 1 auto;

            min-width: 0;

            display: flex;

            flex-direction: column;

            border-radius: 16px;

            overflow: hidden;

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 10%,
                    rgba(8, 8, 12, 0.78)
                );

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 28%,
                    rgba(255,255,255,0.10)
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                0 18px 50px rgba(0,0,0,0.32),
                0 0 30px color-mix(in srgb, var(--accent1) 14%, transparent);

        }


        .chat-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            padding:
                14px
                18px;

            border-bottom:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 22%,
                    rgba(255,255,255,0.08)
                );

            flex: 0 0 auto;

        }


        .chat-header-left {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .chat-header .room-hash {

            font-size: 26px;

        }


        .chat-header-title {

            font-family: "Grandstander", cursive;

            font-size: 24px;

            letter-spacing: -0.5px;

            color: white;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .chat-header-sub {

            font-family: "Jersey 10", monospace;

            font-size: 14px;

            color: rgba(255,255,255,0.45);

            letter-spacing: 0.5px;

        }


        .chat-header-right {

            display: flex;

            align-items: center;

            gap: 8px;

            flex: 0 0 auto;

        }


        .user-pill {

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                6px
                12px;

            border-radius: 999px;

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 20%,
                    rgba(255,255,255,0.05)
                );

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 32%,
                    rgba(255,255,255,0.10)
                );

            font-size: 12px;

            color: white;

            cursor: url("/cursor/Hand.cur"), pointer;

            transition: 0.18s ease;

        }


        .user-pill:hover {

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 35%,
                    rgba(255,255,255,0.08)
                );

        }


        .user-dot {

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: var(--accent2);

            box-shadow:
                0 0 10px
                color-mix(in srgb, var(--accent2) 60%, transparent);

        }


        .user-dot.offline {

            background: #ff5555;

            box-shadow:
                0 0 10px
                rgba(255, 85, 85, 0.6);

        }


        /* =========================================================
           MESSAGES
        ========================================================= */

        .chat-messages {

            flex: 1 1 auto;

            overflow-y: auto;

            padding:
                16px
                18px;

            display: flex;

            flex-direction: column;

            gap: 12px;

            scroll-behavior: smooth;

        }


        .chat-messages::-webkit-scrollbar {

            width: 8px;

        }


        .chat-messages::-webkit-scrollbar-track {

            background: transparent;

        }


        .chat-messages::-webkit-scrollbar-thumb {

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 40%,
                    rgba(255,255,255,0.08)
                );

            border-radius: 999px;

        }


        .msg {

            display: flex;

            gap: 10px;

            max-width: 78%;

            align-items: flex-end;

        }


        .msg.is-own {

            align-self: flex-end;

            flex-direction: row-reverse;

        }


        .msg-avatar {

            width: 34px;

            height: 34px;

            flex: 0 0 auto;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: "Grandstander", cursive;

            font-size: 16px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    color-mix(in srgb, var(--accent1) 70%, transparent),
                    color-mix(in srgb, var(--accent2) 70%, transparent)
                );

            box-shadow:
                0 0 14px
                color-mix(in srgb, var(--accent1) 30%, transparent);

            user-select: none;

        }


        .msg-body {

            display: flex;

            flex-direction: column;

            gap: 3px;

            min-width: 0;

        }


        .msg-meta {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 11px;

            color: rgba(255,255,255,0.45);

            padding:
                0
                4px;

        }


        .msg.is-own .msg-meta {

            justify-content: flex-end;

        }


        .msg-author {

            color: var(--accent2);

            font-weight: 500;

        }


        .msg-time {

            font-family: "Jersey 10", monospace;

            font-size: 13px;

            letter-spacing: 0.5px;

        }


        .msg-bubble {

            padding:
                10px
                14px;

            border-radius: 14px;

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 12%,
                    rgba(255,255,255,0.05)
                );

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 22%,
                    rgba(255,255,255,0.08)
                );

            color: white;

            font-size: 13.5px;

            line-height: 1.45;

            word-wrap: break-word;

            overflow-wrap: anywhere;

            white-space: pre-wrap;

        }


        .msg.is-own .msg-bubble {

            background:
                linear-gradient(
                    135deg,
                    color-mix(in srgb, var(--accent1) 35%, transparent),
                    color-mix(in srgb, var(--accent2) 30%, transparent)
                );

            border-color:
                color-mix(
                    in srgb,
                    var(--accent2) 45%,
                    rgba(255,255,255,0.10)
                );

        }


        .msg-system {

            align-self: center;

            padding:
                5px
                12px;

            border-radius: 999px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.08);

            color: rgba(255,255,255,0.5);

            font-family: "Jersey 10", monospace;

            font-size: 14px;

            letter-spacing: 0.5px;

        }


        .empty-chat {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            flex: 1 1 auto;

            gap: 10px;

            color: rgba(255,255,255,0.4);

            font-family: "Jersey 10", monospace;

            font-size: 20px;

            letter-spacing: 1px;

            text-align: center;

            padding: 30px;

        }


        /* =========================================================
           COMPOSER
        ========================================================= */

        .chat-composer {

            display: flex;

            align-items: flex-end;

            gap: 10px;

            padding:
                12px
                14px;

            border-top:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 22%,
                    rgba(255,255,255,0.08)
                );

            background:
                rgba(0,0,0,0.25);

            flex: 0 0 auto;

        }


        .composer-input {

            flex: 1 1 auto;

            min-width: 0;

            min-height: 42px;

            max-height: 140px;

            resize: none;

            padding:
                11px
                14px;

            border-radius: 12px;

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 26%,
                    rgba(255,255,255,0.10)
                );

            background:
                rgba(0,0,0,0.35);

            color: white;

            font-family: "Lexend", sans-serif;

            font-size: 13.5px;

            line-height: 1.45;

            outline: 0;

            box-sizing: border-box;

            transition: 0.18s ease;

        }


        .composer-input:focus {

            border-color: var(--accent2);

            box-shadow:
                0 0 0 3px
                color-mix(in srgb, var(--accent1) 18%, transparent);

        }


        .composer-input::placeholder {

            color: rgba(255,255,255,0.4);

        }


        .composer-send {

            width: 42px;

            height: 42px;

            flex: 0 0 auto;

            display: flex;

            align-items: center;

            justify-content: center;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    color-mix(in srgb, var(--accent1) 70%, transparent),
                    color-mix(in srgb, var(--accent2) 70%, transparent)
                );

            color: white;

            cursor: url("/cursor/Hand.cur"), pointer;

            transition: 0.18s ease;

            box-shadow:
                0 0 18px
                color-mix(in srgb, var(--accent1) 25%, transparent);

        }


        .composer-send:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 0 24px
                color-mix(in srgb, var(--accent1) 40%, transparent);

        }


        .composer-send:disabled {

            opacity: 0.35;

            cursor: default;

            transform: none;

            box-shadow: none;

        }


        .composer-send svg {

            width: 19px;

            height: 19px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.9;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =========================================================
           ARCTIC STYLE NAVBAR
        ========================================================= */

        .navbar {

            position: fixed;

            top: 50%;

            left: 0;

            height: 1000px;

            transform:
                translateY(-50%);

            width: 82px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            padding:
                12px
                8px;

            box-sizing: border-box;

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 18%,
                    rgba(10, 10, 10, 0.82)
                );

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    rgba(255,255,255,0.1)
                );

            box-shadow:
                0 0 30px
                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    transparent
                ),
                inset 0 0 15px
                rgba(255,255,255,0.04);

            z-index: 99999;

            color: white;

            user-select: none;

            overflow: visible;

            pointer-events: auto;

        }


        .arctic-arctic-item {

            width: 66px;

            min-height: 58px;

            padding:
                8px
                4px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            border: none;

            border-radius: 15px;

            background: transparent;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );

            font-family:
                "Lexend",
                sans-serif;

            cursor:
                url("/cursor/Hand.cur"),
                pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .arctic-arctic-item svg {

            width: 21px;

            height: 21px;

            stroke:
                currentColor;

            fill:
                none;

            stroke-width:
                1.7;

            stroke-linecap:
                round;

            stroke-linejoin:
                round;

            transition:
                0.2s ease;

        }


        .arctic-arctic-label {

            font-size: 9px;

            font-weight: 500;

            line-height: 1;

            white-space: nowrap;

            margin-top: 8px;

        }


        .arctic-arctic-item:hover {

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 18%,
                    rgba(255,255,255,0.06)
                );

            color: white;

            transform:
                translateY(-2px);

        }


        .arctic-arctic-item.is-active {

            background:
                linear-gradient(
                    135deg,
                    color-mix(
                        in srgb,
                        var(--accent1) 15%,
                        transparent
                    ),
                    color-mix(
                        in srgb,
                        var(--accent2) 15%,
                        transparent
                    )
                );

            color: white;

        }


        .nav-separator {

            width: 42px;

            height: 1px;

            margin:
                3px
                0;

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    rgba(255,255,255,0.1)
                );

        }


        /* =========================================================
           MODAL (change name)
        ========================================================= */

        .modal-backdrop {

            position: fixed;

            inset: 0;

            z-index: 100000;

            display: none;

            align-items: center;

            justify-content: center;

            background: rgba(0,0,0,0.65);

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

        }


        .modal-backdrop.active {

            display: flex;

        }


        .modal {

            width: 100%;

            max-width: 380px;

            padding: 24px;

            border-radius: 18px;

            background:
                color-mix(
                    in srgb,
                    var(--accent1) 12%,
                    rgba(12, 12, 16, 0.95)
                );

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 32%,
                    rgba(255,255,255,0.10)
                );

            box-shadow:
                0 24px 60px rgba(0,0,0,0.5),
                0 0 30px
                color-mix(in srgb, var(--accent1) 22%, transparent);

            box-sizing: border-box;

        }


        .modal h3 {

            margin:
                0
                0
                14px;

            font-family: "Grandstander", cursive;

            font-size: 22px;

            letter-spacing: -0.5px;

        }


        .modal input {

            width: 100%;

            box-sizing: border-box;

            padding:
                11px
                14px;

            border-radius: 12px;

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 28%,
                    rgba(255,255,255,0.10)
                );

            background: rgba(0,0,0,0.4);

            color: white;

            font-family: "Lexend", sans-serif;

            font-size: 14px;

            outline: 0;

        }


        .modal input:focus {

            border-color: var(--accent2);

        }


        .modal-actions {

            display: flex;

            gap: 8px;

            margin-top: 16px;

            justify-content: flex-end;

        }


        .modal-actions button {

            padding:
                9px
                16px;

            border-radius: 10px;

            border: none;

            font-family: "Lexend", sans-serif;

            font-size: 13px;

            cursor: url("/cursor/Hand.cur"), pointer;

            transition: 0.18s ease;

        }


        .modal-actions .btn-cancel {

            background: rgba(255,255,255,0.08);

            color: rgba(255,255,255,0.85);

        }


        .modal-actions .btn-cancel:hover {

            background: rgba(255,255,255,0.14);

        }


        .modal-actions .btn-save {

            background:
                linear-gradient(
                    135deg,
                    color-mix(in srgb, var(--accent1) 70%, transparent),
                    color-mix(in srgb, var(--accent2) 70%, transparent)
                );

            color: white;

        }


        .modal-actions .btn-save:hover {

            transform: translateY(-1px);

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 900px) {

            .rooms-panel {

                width: 180px;

            }

        }


        @media (max-width: 700px) {

            #chatShell {

                padding:
                    10px
                    10px
                    10px
                    92px;

                gap: 8px;

            }


            .rooms-panel {

                width: 150px;

                padding: 10px;

            }


            .rooms-title {

                font-size: 18px;

            }


            .room-item {

                padding:
                    8px
                    9px;

                font-size: 12px;

            }


            .room-hash {

                font-size: 16px;

            }


            .chat-header-title {

                font-size: 18px;

            }


            .user-pill .user-name {

                display: none;

            }


            .navbar {

                top: 50%;
                left: 8px;
                bottom: auto;

                transform:
                    translateY(-50%);

                width: 72px;

                max-width: none;

                flex-direction: column;

                padding:
                    10px 5px;

                gap: 6px;

                overflow: visible;

            }


            .arctic-arctic-item {

                width: 48px;

                min-width: 48px;

                min-height: 46px;

                padding:
                    6px
                    2px;

            }


            .arctic-arctic-item svg {

                width: 19px;

                height: 19px;

            }


            .arctic-arctic-label {

                font-size: 7px;

            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div id="bg"></div>


    <!-- =====================================================
         CHAT SHELL
    ====================================================== -->

    <div id="chatShell">


        <!-- ROOMS SIDEBAR -->

        <aside class="rooms-panel">

            <h2 class="rooms-title">rooms</h2>

            <div class="rooms-list" id="roomsList">
                <!-- populated by JS -->
            </div>

            <div class="room-add">

                <input
                    type="text"
                    id="newRoomInput"
                    placeholder="new room"
                    maxlength="24"
                    autocomplete="off"
                    spellcheck="false">

                <button
                    type="button"
                    id="newRoomBtn"
                    title="Create room">
                    +
                </button>

            </div>

        </aside>


        <!-- MAIN CHAT -->

        <section class="chat-panel">

            <header class="chat-header">

                <div class="chat-header-left">

                    <span class="room-hash">#</span>

                    <div style="min-width:0;">

                        <div class="chat-header-title" id="activeRoomName">
                            general
                        </div>

                        <div class="chat-header-sub" id="activeRoomSub">
                            connecting…
                        </div>

                    </div>

                </div>

                <div class="chat-header-right">

                    <button
                        type="button"
                        class="user-pill"
                        id="userPill"
                        title="Change display name">

                        <span class="user-dot" id="userDot"></span>

                        <span class="user-name" id="userNameLabel">
                            anon
                        </span>

                    </button>

                </div>

            </header>


            <div class="chat-messages" id="messagesEl">
                <!-- populated by JS -->
            </div>


            <form class="chat-composer" id="composerForm">

                <textarea
                    class="composer-input"
                    id="composerInput"
                    placeholder="type a message… (enter to send, shift+enter for newline)"
                    rows="1"
                    maxlength="2000"></textarea>

                <button
                    type="submit"
                    class="composer-send"
                    id="sendBtn"
                    title="Send"
                    aria-label="Send">

                    <svg viewBox="0 0 24 24">
                        <path d="M3 11l18-8-8 18-2-8-8-2z"></path>
                    </svg>

                </button>

            </form>

        </section>

    </div>


    <!-- =====================================================
         ARCTIC STYLE NAVBAR
    ====================================================== -->

    <nav
        class="navbar"
        aria-label="Main Navigation">


        <!-- HOME -->

        <a href="home.html">

            <svg class="wordmark-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="width:42px;height:42px;">
                <circle cx="32" cy="32" r="27" stroke="var(--accent1)" stroke-width="2.5"></circle>
                <path d="M32 12v40M12 32h40M18 18l28 28M46 18L18 46"
                      stroke="var(--accent2)" stroke-width="2" stroke-linecap="round"></path>
                <circle cx="32" cy="32" r="8" stroke="var(--accent1)" stroke-width="2.5"></circle>
            </svg>

        </a>


        <button
            type="button"
            class="arctic-arctic-item"
            onclick="window.location.href='home.html'">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24">

                <path
                    d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8">
                </path>

                <path
                    d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z">
                </path>

            </svg>

            <span class="arctic-arctic-label">
                Home
            </span>

        </button>


        <!-- BROWSER -->

        <button
            type="button"
            class="arctic-arctic-item"
            onclick="window.location.href='b.html'">

            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                <path d="M2 12h20"></path>
            </svg>

            <span class="arctic-arctic-label">
                Browser
            </span>

        </button>


        <!-- GAMES -->

        <button
            type="button"
            class="arctic-arctic-item"
            onclick="window.location.href='g.html'">

            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="10" y1="11" y2="11"></line><line x1="8" x2="8" y1="9" y2="13"></line><line x1="15" x2="15.01" y1="12" y2="12"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path></svg>

            <span class="arctic-arctic-label">
                G@mes
            </span>

        </button>


        <!-- APPS -->

        <button
            type="button"
            class="arctic-arctic-item"
            onclick="window.location.href='a.html'">

            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.6"></rect><rect x="13" y="4" width="7" height="7" rx="1.6"></rect><rect x="4" y="13" width="7" height="7" rx="1.6"></rect><rect x="13" y="13" width="7" height="7" rx="1.6"></rect></svg>

            <span class="arctic-arctic-label">
                Apps
            </span>

        </button>


        <!-- AI -->

        <button
            type="button"
            class="arctic-arctic-item"
            onclick="window.location.href='ai.html'">

            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.94 14.06A2 2 0 0 0 8.5 12.62l-5.14-1.32a.5.5 0 0 1 0-.96L8.5 9.02A2 2 0 0 0 9.94 7.58l1.32-5.14a.5.5 0 0 1 .96 0l1.32 5.14a2 2 0 0 0 1.44 1.44l5.14 1.32a.5.5 0 0 1 0 .96l-5.14 1.32a2 2 0 0 0-1.44 1.44l-1.32 5.14a.5.5 0 0 1-.96 0z"></path><path d="M20 3v4M22 5h-4M4 17v2M5 18H3"></path></svg>

            <span class="arctic-arctic-label">
                AI
            </span>

        </button>


        <!-- CHAT (active) -->

        <button
            type="button"
            class="arctic-arctic-item is-active"
            aria-current="page">

            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"></path><path d="M8 12h.01M12 12h.01M16 12h.01"></path></svg>

            <span class="arctic-arctic-label">
                Chat
            </span>

        </button>


        <!-- SETTINGS -->

        <button
            type="button"
            class="arctic-arctic-item"
            onclick="window.location.href='st.html'">

            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg>

            <span class="arctic-arctic-label">
                Settings
            </span>

        </button>

    </nav>


    <!-- =====================================================
         NAME MODAL
    ====================================================== -->

    <div class="modal-backdrop" id="nameModal">

        <div class="modal">

            <h3>change display name</h3>

            <input
                type="text"
                id="nameInput"
                maxlength="24"
                placeholder="your name"
                autocomplete="off"
                spellcheck="false">

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn-cancel"
                    id="nameCancel">
                    cancel
                </button>

                <button
                    type="button"
                    class="btn-save"
                    id="nameSave">
                    save
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================================================
           THEME (matches home.html)
        ========================================================= */

        const themes = {

            default:   { accent1: "#9b59b6", accent2: "#c084fc", bg1: "#000000", bg2: "#b700ff" },
            girly:     { accent1: "#ff69b4", accent2: "#ffb6d9", bg1: "#3a001f", bg2: "#ff69b4" },
            hacker:    { accent1: "#00ff55", accent2: "#00cc44", bg1: "#000800", bg2: "#003b15" },
            ocean:     { accent1: "#00aaff", accent2: "#66ddff", bg1: "#00101f", bg2: "#0066aa" },
            forest:    { accent1: "#35c759", accent2: "#8bdc8b", bg1: "#031007", bg2: "#176b2c" },
            sunset:    { accent1: "#ff512f", accent2: "#dd2476", bg1: "#200000", bg2: "#ff512f" },
            purple:    { accent1: "#b026ff", accent2: "#d580ff", bg1: "#100020", bg2: "#6a00a8" },
            cyber:     { accent1: "#ff00cc", accent2: "#3333ff", bg1: "#08000f", bg2: "#330066" },
            red:       { accent1: "#ff2020", accent2: "#ff6666", bg1: "#120000", bg2: "#8b0000" },
            midnight:  { accent1: "#4d6cff", accent2: "#7289ff", bg1: "#020024", bg2: "#090979" },
            ice:       { accent1: "#66e6ff", accent2: "#b8f5ff", bg1: "#00151c", bg2: "#006b7a" },
            gold:      { accent1: "#ffd700", accent2: "#fff09a", bg1: "#160e00", bg2: "#806000" },
            cherry:    { accent1: "#ff1744", accent2: "#ff6685", bg1: "#180006", bg2: "#8b001c" },
            lavender:  { accent1: "#c77dff", accent2: "#e0aaff", bg1: "#100818", bg2: "#5a189a" },
            neon:      { accent1: "#00ffea", accent2: "#ff00ff", bg1: "#000b12", bg2: "#260026" },
            coffee:    { accent1: "#d2691e", accent2: "#f4a460", bg1: "#100804", bg2: "#5c2e0e" },
            emerald:   { accent1: "#00c878", accent2: "#63ffb5", bg1: "#00140e", bg2: "#006b43" }

        };


        function applyTheme() {

            let name = localStorage.getItem("selectedTheme");
            if (!name || !themes[name]) name = "default";
            const theme = themes[name];
            const root = document.documentElement.style;

            root.setProperty("--accent1", theme.accent1);
            root.setProperty("--accent2", theme.accent2);
            root.setProperty("--theme-bg1", theme.bg1);
            root.setProperty("--theme-bg2", theme.bg2);

            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = theme.bg1;

        }


        /* =========================================================
           STATE
        ========================================================= */

        let userName = localStorage.getItem("chatUserName") || "anon";
        let activeRoom = localStorage.getItem("chatActiveRoom") || "general";
        let rooms = ["general", "random", "help"];
        let history = {};       /* { roomName: [msg] } */
        let ws = null;
        let reconnectTimer = null;
        let currentUserId = null; /* server-assigned id, optional */


        /* =========================================================
           DOM
        ========================================================= */

        const roomsList       = document.getElementById("roomsList");
        const newRoomInput    = document.getElementById("newRoomInput");
        const newRoomBtn      = document.getElementById("newRoomBtn");
        const activeRoomName  = document.getElementById("activeRoomName");
        const activeRoomSub   = document.getElementById("activeRoomSub");
        const messagesEl      = document.getElementById("messagesEl");
        const composerForm    = document.getElementById("composerForm");
        const composerInput   = document.getElementById("composerInput");
        const sendBtn         = document.getElementById("sendBtn");
        const userPill        = document.getElementById("userPill");
        const userNameLabel   = document.getElementById("userNameLabel");
        const userDot         = document.getElementById("userDot");
        const nameModal       = document.getElementById("nameModal");
        const nameInput       = document.getElementById("nameInput");
        const nameCancel      = document.getElementById("nameCancel");
        const nameSave        = document.getElementById("nameSave");


        /* =========================================================
           WEBSOCKET
        ========================================================= */

        function connect() {

            const proto = location.protocol === "https:" ? "wss" : "ws";
            const url = proto + "://" + location.host + "/chat/";

            setStatus("connecting…");
            setDot(false);

            try {
                ws = new WebSocket(url);
            } catch (e) {
                setStatus("offline");
                setDot(false);
                scheduleReconnect();
                return;
            }

            ws.addEventListener("open", () => {
                setStatus("connected");
                setDot(true);
            });

            ws.addEventListener("message", (event) => {

                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (e) {
                    return;
                }

                if (data.type === "init") {

                    rooms = data.rooms || ["general"];
                    history = data.history || {};

                    rooms.forEach((r) => {
                        if (!Array.isArray(history[r])) history[r] = [];
                    });

                    /* Make sure active room exists */
                    if (!rooms.includes(activeRoom)) {
                        activeRoom = rooms[0] || "general";
                    }

                    renderRooms();
                    renderHeader();
                    renderMessages();

                }

                if (data.type === "message") {

                    const room = data.room || "general";
                    if (!Array.isArray(history[room])) history[room] = [];

                    history[room].push(data.message);

                    if (room === activeRoom) renderMessages();
                    renderRooms();
                    renderHeader();

                }

                if (data.type === "room-created") {

                    if (!rooms.includes(data.name)) {
                        rooms.push(data.name);
                        history[data.name] = [];
                    }

                    renderRooms();

                }

                if (data.type === "system") {

                    const room = data.room || "general";
                    if (!Array.isArray(history[room])) history[room] = [];

                    history[room].push({
                        id: Math.random().toString(36).slice(2),
                        system: true,
                        text: data.text,
                        ts: data.ts || Date.now(),
                    });

                    if (room === activeRoom) renderMessages();

                }

            });

            ws.addEventListener("close", () => {
                setStatus("offline — reconnecting…");
                setDot(false);
                scheduleReconnect();
            });

            ws.addEventListener("error", () => {
                setStatus("offline");
                setDot(false);
            });

        }


        function scheduleReconnect() {
            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connect, 2000);
        }


        function setStatus(text) {

            const count = (history[activeRoom] || []).length;
            const msgs = count + (count === 1 ? " message" : " messages");
            activeRoomSub.textContent = msgs + " • " + text;

        }


        function setDot(online) {

            if (!userDot) return;
            userDot.classList.toggle("offline", !online);

        }


        /* =========================================================
           HELPERS
        ========================================================= */

        function formatTime(ts) {
            return new Date(ts).toLocaleTimeString([], {
                hour: "numeric", minute: "2-digit"
            });
        }

        function initialLetter(name) {
            if (!name) return "?";
            return name.trim().charAt(0).toUpperCase() || "?";
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }


        /* =========================================================
           RENDER — ROOMS
        ========================================================= */

        function renderRooms() {

            roomsList.innerHTML = "";

            rooms.forEach((room) => {

                const count = (history[room] || []).length;

                const item = document.createElement("button");
                item.type = "button";
                item.className =
                    "room-item" + (room === activeRoom ? " is-active" : "");

                item.innerHTML = `
                    <span class="room-hash">#</span>
                    <span class="room-name">${escapeHtml(room)}</span>
                    <span class="room-badge">${count}</span>
                `;

                item.addEventListener("click", () => {

                    activeRoom = room;
                    localStorage.setItem("chatActiveRoom", activeRoom);

                    renderRooms();
                    renderHeader();
                    renderMessages();

                });

                roomsList.appendChild(item);

            });

        }


        /* =========================================================
           RENDER — HEADER
        ========================================================= */

        function renderHeader() {

            activeRoomName.textContent = activeRoom;
            userNameLabel.textContent = userName;

            const count = (history[activeRoom] || []).length;
            activeRoomSub.textContent =
                count + (count === 1 ? " message" : " messages");

        }


        /* =========================================================
           RENDER — MESSAGES
        ========================================================= */

        function renderMessages() {

            messagesEl.innerHTML = "";

            const list = history[activeRoom] || [];

            if (list.length === 0) {

                const empty = document.createElement("div");
                empty.className = "empty-chat";
                empty.innerHTML = `
                    no messages in #${escapeHtml(activeRoom)} yet<br>
                    <span style="font-size:14px;opacity:0.7;">be the first to say hi</span>
                `;
                messagesEl.appendChild(empty);
                return;

            }

            list.forEach((msg) => {

                if (msg.system) {

                    const el = document.createElement("div");
                    el.className = "msg-system";
                    el.textContent = msg.text;
                    messagesEl.appendChild(el);
                    return;

                }

                const isOwn = msg.author === userName;

                const wrapper = document.createElement("div");
                wrapper.className = "msg" + (isOwn ? " is-own" : "");

                wrapper.innerHTML = `
                    <div class="msg-avatar">${escapeHtml(initialLetter(msg.author))}</div>
                    <div class="msg-body">
                        <div class="msg-meta">
                            <span class="msg-author">${escapeHtml(msg.author)}</span>
                            <span class="msg-time">${formatTime(msg.ts)}</span>
                        </div>
                        <div class="msg-bubble">${escapeHtml(msg.text)}</div>
                    </div>
                `;

                messagesEl.appendChild(wrapper);

            });

            requestAnimationFrame(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });

        }


        /* =========================================================
           SEND MESSAGE
        ========================================================= */

        function sendMessage() {

            const text = composerInput.value.trim();
            if (!text) return;

            if (!ws || ws.readyState !== 1) {
                setStatus("not connected — retrying…");
                return;
            }

            ws.send(JSON.stringify({
                type: "message",
                room: activeRoom,
                author: userName,
                text: text,
            }));

            composerInput.value = "";
            composerInput.style.height = "auto";
            updateSendBtn();

        }


        function updateSendBtn() {
            sendBtn.disabled = composerInput.value.trim().length === 0;
        }


        /* =========================================================
           COMPOSER
        ========================================================= */

        function autoResize() {

            composerInput.style.height = "auto";
            composerInput.style.height =
                Math.min(composerInput.scrollHeight, 140) + "px";

        }


        composerInput.addEventListener("input", () => {
            autoResize();
            updateSendBtn();
        });


        composerInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });


        composerForm.addEventListener("submit", (e) => {
            e.preventDefault();
            sendMessage();
        });


        /* =========================================================
           NEW ROOM
        ========================================================= */

        function createRoom() {

            let name = newRoomInput.value
                .trim()
                .toLowerCase()
                .replace(/\s+/g, "-")
                .replace(/[^a-z0-9\-_]/g, "")
                .slice(0, 24);

            if (!name) return;

            if (rooms.includes(name)) {

                activeRoom = name;
                localStorage.setItem("chatActiveRoom", activeRoom);

                renderRooms();
                renderHeader();
                renderMessages();

            } else {

                if (ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({
                        type: "create-room",
                        name
                    }));
                }

                activeRoom = name;
                localStorage.setItem("chatActiveRoom", activeRoom);

            }

            newRoomInput.value = "";

        }


        newRoomBtn.addEventListener("click", createRoom);

        newRoomInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                createRoom();
            }
        });


        /* =========================================================
           USERNAME MODAL
        ========================================================= */

        function openNameModal() {
            nameInput.value = userName;
            nameModal.classList.add("active");
            setTimeout(() => nameInput.focus(), 30);
        }

        function closeNameModal() {
            nameModal.classList.remove("active");
        }

        userPill.addEventListener("click", openNameModal);
        nameCancel.addEventListener("click", closeNameModal);

        nameSave.addEventListener("click", () => {

            const v = nameInput.value.trim().slice(0, 24);

            if (v) {
                userName = v;
                localStorage.setItem("chatUserName", v);
                renderHeader();
                renderMessages();
            }

            closeNameModal();

        });

        nameInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                nameSave.click();
            }
            if (e.key === "Escape") closeNameModal();
        });

        nameModal.addEventListener("click", (e) => {
            if (e.target === nameModal) closeNameModal();
        });


        /* =========================================================
           STORAGE — live theme sync across tabs
        ========================================================= */

        window.addEventListener("storage", (event) => {
            if (event.key === "selectedTheme") applyTheme();
        });


        /* =========================================================
           START
        ========================================================= */

        applyTheme();

        renderRooms();
        renderHeader();
        renderMessages();
        updateSendBtn();

        connect();

        composerInput.focus();


    </script>

</body>

</html>
