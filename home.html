<head>

    <meta charset="UTF-8">

        name="viewport"
        content="width=device-width, initial-scale=1.0">

        content="Clever - A customizable homepage with math, research, apps and settings.">

        rel="icon"

        href="https://fonts.googleapis.com">

        rel="stylesheet">


<script src="/register-sw.js"></script>
<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

        }


        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {

            --accent1: #9b59b6;
            --accent2: #c084fc;

            --theme-bg1: #000000;
            --theme-bg2: #b700ff;

        }


        /* =========================================================
           BODY
        ========================================================= */

        body {

            font-family:
                "Lexend",
                sans-serif;

            overflow: hidden;

            color: white;

            cursor:
                url("/cursor/Arrow.cur"),
                auto;

        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        #bg {

            position: fixed;

            inset: 0;

            z-index: -10;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    var(--theme-bg1),
                    var(--theme-bg2)
                );

        }


        #bg::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.214);

            pointer-events: none;

            z-index: 2;

        }


        .background-video {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            pointer-events: none;

            z-index: 0;

        }


        /* =========================================================
           FIREFLIES
        ========================================================= */

        #starContainer {

            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 2;

        }


        .firefly {

            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            opacity: 0;

            filter:
                blur(0.3px);

            will-change:
                transform;

            animation-fill-mode:
                both;

        }


        .firefly::after {

            content: "";

            position: absolute;

            inset: -3px;

            border-radius: 50%;

            background: inherit;

            opacity: 0.25;

            filter:
                blur(5px);

        }


        @keyframes fireflyMove {

            0% {

                transform:
                    translate(0, 0)
                    scale(0.8);

                opacity: 0;

            }

            15% {

                transform:
                    translate(25px, -18px)
                    scale(1);

                opacity: 0.6;

            }

            35% {

                transform:
                    translate(60px, -40px)
                    scale(0.9);

                opacity: 0.85;

            }

            55% {

                transform:
                    translate(95px, -70px)
                    scale(1.05);

                opacity: 0.55;

            }

            75% {

                transform:
                    translate(130px, -105px)
                    scale(0.95);

                opacity: 0.75;

            }

            100% {

                transform:
                    translate(170px, -145px)
                    scale(0.7);

                opacity: 0;

            }

        }


        /* =========================================================
           PAGE IFRAME (for internal pages: b.html, g.html, etc.)
        ========================================================= */

        #pageFrame {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            border: none;

            z-index: 10;

            pointer-events: auto;

            background: transparent;

            display: none;

        }


        /* =========================================================
           SCRAMJET FRAME CONTAINER
           Scramjet injects its own <iframe> into this div.
        ========================================================= */

        #sjContainer {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            z-index: 10;

            display: none;

            background: #000;

        }

        #sjContainer iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;

        }


        /* =========================================================
           ARCTIC-STYLE HOME PANEL
        ========================================================= */

        #homeOverlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 28px 28px 28px 108px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .panel {
            width: 100%;
            max-width: 980px;
            margin-top: clamp(300px, 9vh, 105px);
            padding: 26px;
            text-align: left;
            pointer-events: auto;
            box-sizing: border-box;
            border-radius: 22px;
            background: color-mix(in srgb, var(--accent1) 8%, rgba(8,8,12,.76));
            border: 1px solid color-mix(in srgb, var(--accent1) 28%, rgba(255,255,255,.10));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 18px 55px rgba(0,0,0,.30),
                        0 0 35px color-mix(in srgb, var(--accent1) 14%, transparent);
        }

        .omni-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .wordmark {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .wordmark-mark {
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
        }

        .wordmark-text {
            font-family: "Grandstander", cursive;
            font-size: clamp(34px, 5vw, 52px);
            font-weight: 400;
            letter-spacing: -2px;
            color: white;
            text-shadow: 0 0 25px color-mix(in srgb, var(--accent1) 32%, transparent);
        }

        .omni-clock {
            font-family: "Jersey 10", monospace;
            font-size: clamp(25px, 4vw, 38px);
            color: rgba(255,255,255,.92);
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .search {
            width: 100%;
            margin: 0;
        }

        .search-field {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 62px;
            box-sizing: border-box;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(0,0,0,.25);
            border: 1px solid color-mix(in srgb, var(--accent1) 25%, rgba(255,255,255,.12));
            transition: .2s ease;
        }

        .search-field:focus-within {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent1) 18%, transparent),
                        0 0 22px color-mix(in srgb, var(--accent1) 20%, transparent);
        }

        .search-leading {
            width: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent2);
            flex: 0 0 auto;
        }

        .search-input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: white;
            font-family: "Lexend", sans-serif;
            font-size: 15px;
            padding: 18px 4px;
        }

        .search-input::placeholder { color: rgba(255,255,255,.45); }

        .search-go {
            width: 58px;
            height: 62px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            background: transparent;
            color: rgba(255,255,255,.75);
            cursor: url("/cursor/Hand.cur"), pointer;
            transition: .2s ease;
        }

        .search-go:hover {
            background: color-mix(in srgb, var(--accent1) 20%, transparent);
            color: white;
        }

        .search-hint {
            min-height: 16px;
            margin: 8px 3px 0;
            font-size: 11px;
            color: rgba(255,255,255,.42);
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .quick-link {
            min-height: 48px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid color-mix(in srgb, var(--accent1) 20%, rgba(255,255,255,.08));
            border-radius: 13px;
            background: rgba(0,0,0,.16);
            color: rgba(255,255,255,.82);
            font-family: "Lexend", sans-serif;
            font-size: 12px;
            cursor: url("/cursor/Hand.cur"), pointer;
            transition: .2s ease;
        }

        .quick-link:hover {
            transform: translateY(-2px);
            border-color: var(--accent2);
            background: color-mix(in srgb, var(--accent1) 14%, rgba(255,255,255,.05));
            color: white;
            box-shadow: 0 8px 22px color-mix(in srgb, var(--accent1) 16%, transparent);
        }

        .quick-link-icon {
            width: 26px;
            height: 26px;
            flex: 0 0 26px;
            border-radius: 8px;
            object-fit: cover;
            background: rgba(255,255,255,.08);
        }

        .quick-link-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 700px) {
            .quick-links {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .omni-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .omni-motd {
            margin: 0;
            font-family: "Jersey 10", monospace;
            font-size: 18px;
            color: rgba(255,255,255,.62);
        }

        .omni-stats {
            display: flex;
            gap: 14px;
            color: rgba(255,255,255,.5);
            font-family: "Jersey 10", monospace;
            font-size: 17px;
        }

        .omni-stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .omni-stat svg {
            width: 15px;
            height: 15px;
            stroke: var(--accent2);
            fill: none;
            stroke-width: 1.8;
        }

        /* Old corner stats are replaced by the panel stats. */
        #statsPanel { display: none; }

        @media (max-width: 700px) {
            #homeOverlay {
                padding: 18px 18px 18px 96px;
            }

            .panel {
                margin-top: 20px;
                padding: 19px;
            }

            .omni-top {
                margin-bottom: 20px;
            }

            .wordmark-mark {
                width: 34px;
                height: 34px;
            }

            .wordmark-text {
                font-size: 34px;
            }

            .omni-clock {
                font-size: 25px;
            }

            .omni-bottom {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }
        }


        /* =========================================================
           ARCTIC STYLE NAVBAR
        ========================================================= */

        .navbar {

            position: fixed;

            top: 50%;
            height:1000px;


            transform:
                translateY(-50%);

            width: 82px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            padding:
                12px
                8px;

            box-sizing: border-box;


            background:
                color-mix(
                    in srgb,
                    var(--accent1) 18%,
                    rgba(10, 10, 10, 0.82)
                );

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    rgba(255,255,255,0.1)
                );

            box-shadow:
                0 0 30px
                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    transparent
                ),
                inset 0 0 15px
                rgba(255,255,255,0.04);

            z-index: 99999;

            color: white;

            user-select: none;

            overflow: visible;

            pointer-events: auto;

        }


        .arctic-arctic-item {

            width: 66px;

            min-height: 58px;

            padding:
                8px
                4px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            border: none;

            border-radius: 15px;

            background:
                transparent;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );

            font-family:
                "Lexend",
                sans-serif;

            cursor:
                url("/cursor/Hand.cur"),
                pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .arctic-arctic-item svg {

            width: 21px;

            height: 21px;

            stroke:
                currentColor;

            fill:
                none;

            stroke-width:
                1.7;

            stroke-linecap:
                round;

            stroke-linejoin:
                round;

            transition:
                0.2s ease;

        }


        .arctic-arctic-label {

            font-size: 9px;

            font-weight: 500;

            line-height: 1;

            white-space: nowrap;
            
            margin-top:8px

        }


        .arctic-arctic-item:hover {

            background:

                color-mix(
                    in srgb,
                    var(--accent1) 18%,
                    rgba(255,255,255,0.06)
                );

            color:
                white;

            transform:
                translateY(-2px);

        }


        .arctic-arctic-item.is-active {

            background:

                linear-gradient(

                    135deg,

                    color-mix(
                        in srgb,
                        var(--accent1) 15%,
                        transparent
                    ),

                    color-mix(
                        in srgb,
                        var(--accent2) 15%,
                        transparent
                    )

                );

            color:
                white;

        }


        .nav-separator {

            width: 42px;

            height: 1px;

            margin:
                3px
                0;

            background:

                color-mix(
                    in srgb,
                    var(--accent1) 30%,
                    rgba(255,255,255,0.1)
                );

        }


        /* =========================================================
           SECRET
        ========================================================= */

        #secret676767 {

            position: fixed;

            inset: 0;

            z-index: 1000000;

            display: none;

            background: #000;

            color: white;

            align-items: center;

            justify-content: center;

            font-family:
                "Grandstander",
                cursive;

            font-size: 40px;

        }


        #secret676767.active {

            display: flex;

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            .logo {

                font-size: 64px;

            }


            .quick-options {

                padding-left: 22px;

                padding-right: 22px;

                font-size: 16px;

            }


            .navbar {

                top: 50%;
                left: 12px;
                bottom: auto;

                transform:
                    translateY(-50%);

                width: 72px;

                max-width:
                    none;

                flex-direction:
                    column;

                padding:
                    10px 5px;

                gap:
                    6px;

                overflow:
                    visible;

            }


            .arctic-arctic-item {

                width: 48px;

                min-width: 48px;

                min-height: 46px;

                padding:
                    6px
                    2px;
                
            }


            .arctic-arctic-item svg {

                width: 19px;

                height: 19px;

            }


            .arctic-arctic-label {

                font-size: 7px;

            }


            .nav-separator {

                width: 1px;

                height: 32px;

                margin:
                    0
                    2px;

            }


            #statsPanel {

                min-width: 140px;

            }

        }

    

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div id="bg"></div>


    <!-- FIREFLIES -->

    <div id="starContainer"></div>


    <!-- PAGE IFRAME (internal pages) -->

    <iframe
        id="pageFrame"
        src="about:blank"
        title="Page Content">
    </iframe>


    <!-- SCRAMJET FRAME CONTAINER (proxied content) -->

    <div id="sjContainer"></div>


    <!-- =====================================================
         STATS PANEL
    ====================================================== -->

    <div id="statsPanel">


        <!-- TIME -->

        <div class="stat-item">

            <div class="stat-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="9">
                    </circle>

                    <polyline
                        points="12 7 12 12 15 14">
                    </polyline>

                </svg>

            </div>

            <div class="stat-info">

                <div class="stat-label">
                    Time
                </div>

                <div
                    class="stat-value"
                    id="timeValue">

                    --:--

                </div>

            </div>

        </div>


        <!-- FPS -->

        <div class="stat-item">

            <div class="stat-icon">

                <svg viewBox="0 0 24 24">

                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="12"
                        rx="1">
                    </rect>

                    <line
                        x1="8"
                        y1="20"
                        x2="16"
                        y2="20">
                    </line>

                    <line
                        x1="12"
                        y1="16"
                        x2="12"
                        y2="20">
                    </line>

                </svg>

            </div>

            <div class="stat-info">

                <div class="stat-label">
                    FPS
                </div>

                <div
                    class="stat-value"
                    id="fpsValueOld">

                    -- FPS

                </div>

            </div>

        </div>


        <!-- PING -->

        <div class="stat-item">

            <div class="stat-icon">

                <svg viewBox="0 0 24 24">

                    <line
                        x1="12"
                        y1="5"
                        x2="12"
                        y2="14">
                    </line>

                    <circle
                        cx="12"
                        cy="18"
                        r="1">
                    </circle>

                </svg>

            </div>

            <div class="stat-info">

                <div class="stat-label">
                    Ping
                </div>

                <div
                    class="stat-value"
                    id="pingValueOld">

                    -- ms

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         ARCTIC-STYLE HOME
    ====================================================== -->

    <div id="homeOverlay">

        <section class="panel bento-panel bento-omni">

            <div class="omni-main">

                <div class="omni-top">

                    <div class="wordmark">

                        <svg class="wordmark-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                            <circle cx="32" cy="32" r="27" stroke="var(--accent1)" stroke-width="2.5"></circle>
                            <path d="M32 12v40M12 32h40M18 18l28 28M46 18L18 46"

                            <circle cx="32" cy="32" r="8" stroke="var(--accent1)" stroke-width="2.5"></circle>
                        </svg>

                        <span class="wordmark-text">eclipse</span>

                    </div>

                </div>

                <form class="search" id="omniSearch" role="search">

                                <circle cx="11" cy="11" r="7"></circle>
                                <path d="M20 20l-3.4-3.4"></path>
                            </svg>
                        </span>

                        <input
                            class="search-input"
                            id="omniInput"
                            type="text"
                            placeholder="Search DuckDuckGo or enter a link"

                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

                    </button>

                    <button class="quick-link" type="button" data-url="https://listenfree.in/">
                        <img class="quick-link-icon" src="/images/music.png" alt="">
                        <span class="quick-link-name">Music</span>
                    </button>

                    <button class="quick-link" type="button" data-url="https://chatgpt.com/">

                    </button>

                    <button class="quick-link" type="button" data-url="https://www.roblox.com/">
                        <img class="quick-link-icon" src="/images/roblox.png" alt="">

                    </button>

                    <button class="quick-link" type="button" data-url="https://discord.com/">
                        <img class="quick-link-icon" src="/images/discord.png" alt="">
                        <span class="quick-link-name">Discord</span>
                    </button>

                    <button class="quick-link" type="button" data-url="https://www.twitch.tv/">
                        <img class="quick-link-icon" src="/images/twitch.png" alt="">
                        <span class="quick-link-name">Twitch</span>

                </div>

                <div class="omni-bottom">

                    <p class="omni-motd">
                        motd: hi and welcome
                    </p>

                    <div class="omni-stats">

                        <span class="omni-stat">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="4" width="18" height="12" rx="1"></rect>
                                <path d="M8 20h8M12 16v4"></path>
                            </svg>
                            <span id="fpsValue">-- FPS</span>
                        </span>

                        <span class="omni-stat">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 5v9"></path>
                                <circle cx="12" cy="18" r="1"></circle>
                            </svg>
                            <span id="pingValue">-- ms</span>
                        </span>

                    </div>

                </div>

            </div>

        </section>

    </div>

    <!-- =====================================================
         ARCTIC STYLE NAVBAR
    ====================================================== -->

    <nav
        class="navbar"
        aria-label="Main Navigation">


        <!-- HOME -->


       <a href="home.html">
                            <svg class="wordmark-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">

            document

                        `switchPage('${page}')`

            if (clickedButton) {

        /* =========================================================

        function applyTheme() {


            let themeName =
                localStorage.getItem(
                    "selectedTheme"
                );


            if (
                !themeName ||
                !themes[themeName]
            ) {

                themeName =
                    "default";

            }


            const theme =
                themes[themeName];


            const root =
                document.documentElement.style;


            root.setProperty(
                "--accent1",
                theme.accent1
            );


            root.setProperty(
                "--accent2",
                theme.accent2
            );


            root.setProperty(
                "--theme-bg1",
                theme.bg1
            );


            root.setProperty(
                "--theme-bg2",
                theme.bg2
            );


            const metaTheme =
                document.querySelector(
                    'meta[name="theme-color"]'
                );


            if (metaTheme) {

                metaTheme.content =
                    theme.bg1;

            }

        }

        function setBackground(
            type,
            value = ""
        ) {


            localStorage.setItem(
                "bgType",
                type
            );


            localStorage.setItem(
                "bgValue",
                value
            );


            if (type === "color") {

                localStorage.setItem(
                    "activeBackground",
                    value
                );

            }

            else if (type === "none") {

                localStorage.setItem(
                    "activeBackground",
                    "none"
                );

            }

            else {

                localStorage.setItem(
                    "activeBackground",
                    value || type
                );

            }


            applyBackground();

        }


        /* =========================================================
           BACKGROUND SYSTEM
        ========================================================= */

        function applyBackground() {


            const bg =
                document.getElementById(
                    "bg"
                );


            if (!bg) return;


            let type =
                localStorage.getItem(
                    "bgType"
                );


            let value =
                localStorage.getItem(
                    "bgValue"
                );


            if (!type) {

                type =
                    "video";


                value =
                    "/background-imgs/MOMMY ANIMATION MEME.mp4";

            }


            if (value === null) {

                value = "";

            }


            let themeName =
                localStorage.getItem(
                    "selectedTheme"
                );


            if (
                !themeName ||
                !themes[themeName]
            ) {

                themeName =
                    "default";

            }


            const theme =
                themes[themeName];


            const fallbackGradient =
                `linear-gradient(
                    135deg,
                    ${theme.bg1},
                    ${theme.bg2}
                )`;


            bg.style.background =
                fallbackGradient;


            const oldVideo =
                bg.querySelector(
                    ".background-video"
                );


            if (oldVideo) {

                oldVideo.pause();

                oldVideo.removeAttribute(
                    "src"
                );

                oldVideo.load();

                oldVideo.remove();

            }


            bg.style.backgroundImage =
                "none";


            bg.style.backgroundPosition =
                "";


            bg.style.backgroundSize =
                "";


            bg.style.backgroundRepeat =
                "";


            if (type === "none") {

                bg.style.background =
                    fallbackGradient;

                return;

            }


            if (type === "color") {

                bg.style.background =
                    value && value.trim()
                        ? value
                        : "#000000";

                return;

            }


            if (type === "image") {


                if (
                    !value ||
                    !value.trim()
                ) {

                    bg.style.background =
                        fallbackGradient;

                    return;

                }


                bg.style.background =
                    fallbackGradient;


                bg.style.backgroundImage =
                    `url("${value.replace(/"/g, '\\"')}")`;


                bg.style.backgroundPosition =
                    "center";


                bg.style.backgroundSize =
                    "cover";


                bg.style.backgroundRepeat =
                    "no-repeat";


                return;

            }


            if (
                type === "video" ||
                type === "default"
            ) {


                let videoSource =
                    value;


                if (
                    type === "default" ||
                    !videoSource ||
                    !videoSource.trim()
                ) {

                    videoSource =
                        "/background-imgs/MOMMY ANIMATION MEME.mp4";

                }


                const video =
                    document.createElement(
                        "video"
                    );


                video.className =
                    "background-video";


                video.autoplay =
                    true;


                video.loop =
                    true;


                video.muted =
                    true;


                video.defaultMuted =
                    true;


                video.playsInline =
                    true;


                video.preload =
                    "metadata";


                video.setAttribute(
                    "aria-hidden",
                    "true"
                );


                video.src =
                    videoSource;


                bg.appendChild(
                    video
                );


                video.play()
                    .catch(
                        () => {

                            setTimeout(
                                () => {

                                    video.play()
                                        .catch(() => {});

                                },
                                500
                            );

                        }
                    );


                video.addEventListener(
                    "error",
                    () => {

                        video.remove();

                        bg.style.background =
                            fallbackGradient;

                    },
                    { once: true }
                );


                return;

            }


            bg.style.background =
                fallbackGradient;

        }

        /* =========================================================
           FPS COUNTER
        ========================================================= */

        let frameCount = 0;


        let lastFpsTime =
            performance.now();


        function updateFPS(now) {


            frameCount++;


            const elapsed =
                now -
                lastFpsTime;


            if (elapsed >= 1000) {


                const currentFps =
                    Math.round(
                        (
                            frameCount *
                            1000
                        ) /
                        elapsed
                    );


                const fpsElement =
                    document.getElementById(
                        "fpsValue"
                    );


                if (fpsElement) {

                    fpsElement.textContent =
                        currentFps +
                        " FPS";

                }


                frameCount = 0;


                lastFpsTime =
                    now;

            }


            requestAnimationFrame(
                updateFPS
            );

        }


        requestAnimationFrame(
            updateFPS
        );

            catch (error) {

        /* =========================================================
           SCRAMJET CONTROLLER BOOTSTRAP
           Uses the same setup as the demo's index.js:
             - files paths under /scram/
             - BareMux transport via /wisp/ with libcurl
        ========================================================= */

        let sjController = null;
        let sjConnection = null;

        function bootScramjet() {

            if (typeof $scramjetLoadController !== "function") {

                console.warn(
                    "Scramjet loader not found. " +
                    "Check that /scram/scramjet.all.js is served."
                );

                return null;

            }

            try {

                const { ScramjetController } =
                    $scramjetLoadController();

                const controller = new ScramjetController({

                    files: {
                        wasm: "/scram/scramjet.wasm.wasm",
                        all:  "/scram/scramjet.all.js",
                        sync: "/scram/scramjet.sync.js",
                    },

                });

                controller.init();

                sjConnection =
                    new BareMux.BareMuxConnection(
                        "/baremux/worker.js"
                    );

                return controller;

            }

            catch (err) {

                console.error(
                    "Failed to boot Scramjet:",
                    err
                );

                return null;

            }

        }

        async function ensureScramjetReady() {

            /* Register service worker once */
            if (typeof registerSW === "function") {

                try {

                    await registerSW();

                }

                catch (err) {

                    console.warn(
                        "SW registration warning:",
                        err
                    );

                }

            }

            /* Configure BareMux transport if needed */
            if (sjConnection) {

                const wispUrl =
                    (location.protocol === "https:"
                        ? "wss"
                        : "ws") +
                    "://" +
                    location.host +
                    "/wisp/";

                try {

                    const current =
                        await sjConnection.getTransport();

                    if (current !== "/libcurl/index.mjs") {

                        await sjConnection.setTransport(
                            "/libcurl/index.mjs",
                            [{ websocket: wispUrl }]
                        );

                    }

                }

                catch (err) {

                    console.warn(
                        "Transport setup warning:",
                        err
                    );

                }

            }

        }

        async function openThroughScramjet(targetUrl, hintEl) {

            if (!sjController) {

                sjController = bootScramjet();

                if (!sjController) {

                    if (hintEl)
                        hintEl.textContent =
                            "Scramjet failed to load.";

                    return;

                }

            }

            if (hintEl)
                hintEl.textContent =
                    "Loading through Scramjet…";

            /* Prepare UI: hide home, show proxied container */
            homeOverlay.style.display = "none";

            pageFrame.src = "about:blank";
            pageFrame.style.display = "none";

            sjContainer.innerHTML = "";
            sjContainer.style.display = "block";

            try {

                await ensureScramjetReady();

                const frame =
                    sjController.createFrame();

                sjContainer.appendChild(
                    frame.frame
                );

                frame.go(targetUrl);

                if (hintEl)
                    hintEl.textContent = "";

            }

            catch (err) {

                console.error(err);

                if (hintEl)
                    hintEl.textContent =
                        "Failed: " + err.message;

            }

        }


        /* =========================================================
           ARCTIC HOME SEARCH — ROUTED THROUGH SCRAMJET
        ========================================================= */

        const omniSearch =
            document.getElementById(
                "omniSearch"
            );


        function buildSearchQueryUrl(query) {

            const searchEngine =
                localStorage.getItem("searchEngine");

            const baseUrl =
                searchEngine === "brave"
                    ? "https://search.brave.com/search?q="
                    : "https://duckduckgo.com/?q=";

            return baseUrl + encodeURIComponent(query);

        }


        function openInBrowser(targetUrl) {

            switchPage("b.html");

            pageFrame.src =
                "b.html?target=" +
                encodeURIComponent(targetUrl);

        }


        document
            .querySelectorAll(".quick-link")
            .forEach(button => {

                button.addEventListener("click", () => {

                    const target =
                        button.getAttribute("data-url");

                    if (!target) return;

                    openInBrowser(target);

                });

            });


        if (omniSearch) {

            omniSearch.addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    const input =
                        document.getElementById(
                            "omniInput"
                        );

                    const hint =
                        document.getElementById(
                            "searchHint"
                        );

                    const value =
                        input.value.trim();

                    if (!value) {

                        if (hint)
                            hint.textContent =
                                "Type something to search.";

                        return;

                    }

                    /* URL or plain query? */
                    const looksLikeUrl =
                        /^(https?:\/\/|localhost[:/]|[\w.-]+\.[a-z]{2,})/i
                        .test(value);

                    let target;

                    if (looksLikeUrl) {

                        target =
                            /^https?:\/\//i.test(value)
                                ? value
                                : "https://" + value;

                    }

                    else {

                        target = buildSearchQueryUrl(value);

                    }

                    openInBrowser(target);

                }
            );

        }


        /* =========================================================
           START
        ========================================================= */

        applySettings();


        pageFrame.style.display =
            "none";

        sjContainer.style.display =
            "none";


        homeOverlay.style.display =
            "flex";


    </script>

</body>

</html>
