<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clever</title>

    <link
        rel="icon"
        type="image/png"
        href="https://th.bing.com/th/id/ODF.cCsv-cCt-jkEcwiJYMYj4A?w=32&h=32&qlt=90&pcl=fffffc&o=6&pid=1.2"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Grandstander:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --accent1: #9b59b6;
            --accent2: #c084fc;
            --theme-bg1: #000000;
            --theme-bg2: #b700ff;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            overflow-x: hidden;
            font-family: "Grandstander", cursive;
            color: white;
        }

        /* =========================
           BACKGROUND
        ========================= */

        #bg {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    var(--theme-bg1),
                    var(--theme-bg2)
                );

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            overflow: hidden;
            z-index: 0;
        }

        .background-video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            pointer-events: none;
            z-index: 0;
        }

        /* =========================
           DARK BACKGROUND OVERLAY
        ========================= */

        #bg::after {
            content: "";

            position: absolute;
            inset: 0;

            background: rgba(0, 0, 0, 0.214);

            pointer-events: none;
            z-index: 1;
        }

        .background-video {
            z-index: 0 !important;
        }

        /* =========================
           STARS
        ========================= */

        #starContainer {
            position: fixed;
            inset: 0;

            z-index: 2;

            pointer-events: none;
        }

        .star {
            position: absolute;

            border-radius: 50%;

            background: white;

            opacity: 0.4;

            animation: twinkle infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.4);
            }

        }

        /* =========================
           CONTENT
        ========================= */

        .page {
            position: relative;

            z-index: 3 !important;

            display: flex;

            justify-content: center;

            padding: 40px 0;
        }

        .panel {
            width: min(600px, 90vw);

            padding: 30px;

            border-radius: 18px;

            background: transparent;

            backdrop-filter: none;

            box-shadow: none;

            border: none;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .panel button {
            width: 100%;

            padding: 12px 14px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            background:
                rgba(73, 73, 73, 0.144);

            color: white;

            cursor: pointer;

            transition: 0.2s;

            font-family:
                "Grandstander",
                cursive;
        }

        .panel button:hover {
            background:
                rgba(255, 255, 255, 0.16);

            transform:
                translateY(-2px);
        }

        .panel button:active {
            transform:
                scale(0.98);
        }

        .search-engine-buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            width: 100%;
        }

        .search-engine-button {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(73,73,73,.144);
            color: white;
            cursor: pointer;
            transition: .2s ease;
            font-family: "Grandstander", cursive;
        }

        .search-engine-button:hover {
            border-color: var(--accent2);
            background: color-mix(in srgb, var(--accent1) 20%, rgba(73,73,73,.144));
            transform: translateY(-2px);
        }

        .search-engine-button.active {
            border-color: var(--accent2);
            background: color-mix(in srgb, var(--accent1) 28%, rgba(73,73,73,.144));
            color: white;
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent1) 18%, transparent);
        }

        @media (max-width: 600px) {
            .search-engine-buttons {
                grid-template-columns: 1fr;
            }
        }

        /* =========================
           GROUPS
        ========================= */

        .group {
            width: 100%;

            padding: 12px;

            border-radius: 20px;

            background:
                rgba(0, 0, 0, 0.096);

            margin: 20px 0;

            font-family:
                "Grandstander",
                cursive;

            box-sizing: border-box;
        }

        .group h2 {
            text-align: center;
        }

        /* =========================
           SMALL BUTTONS
        ========================= */

        .small {
            width: 42px;
            height: 30px;

            padding: 0;

            border-radius: 8px;
        }

        .nf {
            background-color:
                rgba(255, 255, 255, 0.151);

            border-color: white;

            color: white;

            font-family:
                "Grandstander",
                cursive;
        }

        .random-input {
            font-family:
                "Grandstander",
                cursive;

            background-color:
                rgba(255, 255, 255, 0.18);
        }

        /* =========================
           INPUTS
        ========================= */

        input,
        select {
            width: 100%;

            padding: 10px;

            border-radius: 10px;

            border: none;

            outline: none;

            text-align: center;

            box-sizing: border-box;

            font-family:
                "Grandstander",
                cursive;
        }

        /* =========================
           SETTINGS
        ========================= */

        .settings-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(100px, 1fr)
                );

            gap: 12px;

            width: 100%;

            max-width: 620px;

            height: 420px;

            overflow-y: auto;

            overflow-x: hidden;

            padding-right: 6px;

            margin: auto;
        }

        .setting-btn {
            max-width: 170px;

            min-height: 70px;

            border-radius: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            text-align: center;

            font-size: 12px;

            gap: 3px;

            font-family:
                "Grandstander",
                cursive;
        }

        .setting-btn:hover {
            transform:
                translateY(-2px);
        }

        .setting-btn.active {

            border:
                1px solid
                rgba(110, 190, 255, 0.95);

            box-shadow:
                0 0 12px
                rgba(110, 190, 255, 0.35),

                0 0 24px
                rgba(110, 190, 255, 0.18),

                inset 0 0 12px
                rgba(110, 190, 255, 0.08);

            background:
                rgba(255, 255, 255, 0.08);

            transform:
                translateY(-2px);
        }

        .button-container {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 12px;

            max-height: 300px;

            overflow-y: auto;

            overflow-x: hidden;

            padding: 10px;
        }

        .button-container button {
            flex: 1 1 120px;

            min-width: 120px;

            padding: 12px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            background:
                rgba(255, 255, 255, 0.06);

            color: white;

            cursor: pointer;

            transition: 0.2s;

            font-family:
                "Grandstander",
                cursive;
        }

        .button-container button:hover {
            transform:
                translateY(-2px);

            background:
                rgba(255, 255, 255, 0.12);
        }

        /* =========================
           THEME BUTTONS
        ========================= */

        .theme-btn {
            min-height: 75px !important;

            font-size: 14px !important;

            font-weight: 600;
        }

        .theme-preview {
            width: 45px;
            height: 15px;

            border-radius: 20px;

            margin-bottom: 4px;
        }

        .theme-default .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #000,
                    #b700ff
                );
        }

        .theme-girly .theme-preview {
            background:

                    90deg,
                    #ff69b4,
                    #ffb6d9
                );
        }

        .theme-hacker .theme-preview {
            background:

                    90deg,
                    #001a00,
                    #00ff55
                );
        }

        .theme-ocean .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #001f3f,
                    #00aaff
                );
        }

        .theme-forest .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #071a0b,
                    #238636
                );
        }

        .theme-sunset .theme-preview {
            background:

                    90deg,
                    #ff512f,
                    #dd2476
                );
        }

        .theme-purple .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #4b0082,
                    #b026ff
                );
        }

        .theme-cyber .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #ff00cc,
                    #3333ff
                );
        }

        .theme-red .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #3a0000,
                    #ff2020
                );
        }

        .theme-midnight .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #020024,
                    #090979
                );
        }

        .theme-ice .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #003b46,
                    #66e6ff
                );
        }

        .theme-gold .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #3d2800,
                    #ffd700
                );
        }

        .theme-cherry .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #250008,
                    #d90429
                );
        }

        .theme-lavender .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #301934,
                    #c77dff
                );
        }

        .theme-neon .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #00ffea,
                    #ff00ff
                );
        }

        .theme-coffee .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #1b0f08,
                    #8b4513
                );
        }

        .theme-emerald .theme-preview {
            background:
                linear-gradient(
                    90deg,
                    #001f16,
                    #00c878
                );
        }

        /* =========================
           SEARCH ENGINE
        ========================= */

        .search-engine-picker {
            padding: 14px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.06);
        }

        .search-engine-labels {
            display: flex;

            justify-content: space-between;

            gap: 16px;

            margin-bottom: 12px;

            font-size: 14px;
        }

        .search-engine-labels span {
            color: rgba(255, 255, 255, 0.5);

            transition: color 0.2s ease;
        }

        .search-engine-labels .is-selected {
            color: white;

            font-weight: 600;
        }

        .search-engine-switch {
            position: relative;

            width: 42px;

            height: 23px;

            display: block;

            margin: 0 auto;

            cursor: pointer;
        }

        .search-engine-switch input {
            position: absolute;

            width: 1px;

            height: 1px;

            margin: -1px;

            overflow: hidden;

            clip: rect(0 0 0 0);
        }

        .search-engine-switch-track {
            position: absolute;

            inset: 0;

            border: 1px solid rgba(255, 255, 255, 0.22);

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.16);

            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .search-engine-switch-track::after {
            content: "";

            position: absolute;

            top: 3px;

            left: 3px;

            width: 15px;

            height: 15px;

            border-radius: 50%;

            background: white;

            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);

            transition: transform 0.2s ease;
        }

        .search-engine-switch input:checked + .search-engine-switch-track {
            border-color: color-mix(in srgb, var(--accent2) 80%, white);

            background: linear-gradient(
                90deg,
                var(--accent1),
                var(--accent2)
            );
        }

        .search-engine-switch input:checked + .search-engine-switch-track::after {
            transform: translateX(19px);
        }

        .search-engine-switch input:focus-visible + .search-engine-switch-track {
            outline: 2px solid white;

            outline-offset: 3px;
        }

        /* =========================
           INACTIVE TAB OVERLAY
        ========================= */

        #inactiveOverlay {
            position: fixed;

            inset: 0;

            background: #000;

            z-index: 999999999;

            display: none;

            pointer-events: none;
        }

        #inactiveOverlay.active {
            display: block;
        }

    </style>
</head>

        function getCurrentTheme() {

            const themeName =
                localStorage.getItem("selectedTheme") ||
                "default";

            return themes[themeName] ||
                themes.default;

        }


        function showThemeBackground() {

            const bg =
                document.getElementById("bg");

            const theme =
                getCurrentTheme();

            if (!bg) return;

            bg.style.background =
                `linear-gradient(
                    135deg,
                    ${theme.bg1},
                    ${theme.bg2}
                )`;

            bg.style.backgroundImage =
                `linear-gradient(
                    135deg,
                    ${theme.bg1},
                    ${theme.bg2}
                )`;

        }


        function setTheme(themeName) {

            if (!themes[themeName]) return;

            localStorage.setItem(
                "selectedTheme",
                themeName
            );

            applyTheme();

            /*
                Reapply background so None updates
                to the newly selected theme.
            */

            applyBackground();

        }


        function applyTheme() {

            const theme =
                getCurrentTheme();

            document.documentElement.style.setProperty(
                "--accent1",
                theme.accent1
            );

            document.documentElement.style.setProperty(
                "--accent2",
                theme.accent2
            );

            document.documentElement.style.setProperty(
                "--theme-bg1",
                theme.bg1
            );

            document.documentElement.style.setProperty(
                "--theme-bg2",
                theme.bg2
            );

            updateThemeButtons();

        }


        function updateThemeButtons() {

            const current =
                localStorage.getItem(
                    "selectedTheme"
                ) || "default";

            document
                .querySelectorAll("[data-theme]")
                .forEach(button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.theme === current
                    );

                });

        }

    </script>


    <!-- =========================
         BACKGROUND SYSTEM
    ========================= -->

    <script>

        const DEFAULT_BACKGROUND =
            "/background-imgs/MOMMY ANIMATION MEME.mp4";


        function setBackground(
            type,
            value = ""
        ) {

            localStorage.setItem(
                "bgType",
                type
            );

            localStorage.setItem(
                "bgValue",
                value
            );

            localStorage.setItem(
                "activeBackground",
                value || type
            );

            applyBackground();

            updateActiveBackgroundButton();

        }


        function updateActiveBackgroundButton() {

            const type =
                localStorage.getItem(
                    "bgType"
                ) || "video";

            const value =
                localStorage.getItem(
                    "bgValue"
                ) || DEFAULT_BACKGROUND;


            document
                .querySelectorAll(
                    ".button-container .setting-btn[data-type]"
                )
                .forEach(button => {

                    button.classList.remove(
                        "active"
                    );


                    const buttonType =
                        button.dataset.type || "";

                    const buttonValue =
                        button.dataset.bg || "";


                    if (
                        buttonType === type &&
                        buttonValue === value
                    ) {

                        button.classList.add(
                            "active"
                        );

                    }

                });

        }


        function removeOldVideo(bg) {

            const oldVideo =
                bg.querySelector(
                    ".background-video"
                );

            if (oldVideo) {

                oldVideo.pause();

                oldVideo.remove();

            }

        }


        function applyBackground() {

            let type =
                localStorage.getItem(
                    "bgType"
                );

            let value =
                localStorage.getItem(
                    "bgValue"
                );


            /*
                New users get Default video.
            */

            if (!type) {

                type = "video";

                value =
                    DEFAULT_BACKGROUND;

                localStorage.setItem(
                    "bgType",
                    type
                );

                localStorage.setItem(
                    "bgValue",
                    value
                );

            }


            const bg =
                document.getElementById("bg");

            if (!bg) return;


            /*
                Remove previous video.
            */

            removeOldVideo(bg);


            /*
                Reset background.
            */

            bg.style.background = "none";

            bg.style.backgroundImage = "none";

            bg.style.backgroundColor = "transparent";


            /*
                NONE
            */

            if (type === "none") {

                showThemeBackground();

                return;

            }


            /*
                Missing value fallback.
            */

            if (!value) {

                showThemeBackground();

                return;

            }


            /*
                IMAGE / GIF
            */

            if (type === "image") {

                bg.style.backgroundImage =
                    `url("${value}")`;

                bg.style.backgroundPosition =
                    "center";

                bg.style.backgroundSize =
                    "cover";

                bg.style.backgroundRepeat =
                    "no-repeat";

                return;

            }


            /*
                VIDEO
            */

            if (type === "video") {

                const video =
                    document.createElement(
                        "video"
                    );

                video.className =
                    "background-video";

                video.src = value;

                video.autoplay = true;

                video.loop = true;

                video.muted = true;

                video.defaultMuted = true;

                video.playsInline = true;

                video.preload = "auto";

                video.setAttribute(
                    "aria-hidden",
                    "true"
                );


                bg.appendChild(video);


                video.play()
                    .catch(() => {

                        /*
                            Browser may wait until
                            interaction. Keep the
                            video element available.
                        */

                    });


                video.addEventListener(
                    "error",
                    () => {

                        video.remove();

                        showThemeBackground();

                    }
                );


                return;

            }


            /*
                Unknown background type.
            */

            showThemeBackground();

        }


        document.addEventListener(
            "DOMContentLoaded",
            () => {

                applyTheme();

                applyBackground();

                updateActiveBackgroundButton();

                updateThemeButtons();

            }
        );

    </script>

         SEARCH ENGINE
    ========================= -->

    <script>

        const SEARCH_ENGINE_STORAGE_KEY =
            "searchEngine";

        function getSelectedSearchEngine() {

            return localStorage.getItem(
                SEARCH_ENGINE_STORAGE_KEY
            ) === "brave"
                ? "brave"
                : "duckduckgo";

        }

        function updateSearchEngineButtons() {

            const engine =
                getSelectedSearchEngine();

            const duckButton =
                document.getElementById("duckduckgoButton");

            const braveButton =
                document.getElementById("braveButton");

            if (duckButton) {
                duckButton.classList.toggle(
                    "active",
                    engine === "duckduckgo"
                );
            }

            if (braveButton) {
                braveButton.classList.toggle(
                    "active",
                    engine === "brave"
                );
            }

        }

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const duckButton =
                    document.getElementById("duckduckgoButton");

                const braveButton =
                    document.getElementById("braveButton");

                if (duckButton) {
                    duckButton.addEventListener(
                        "click",
                        () => {
                            localStorage.setItem(
                                SEARCH_ENGINE_STORAGE_KEY,
                                "duckduckgo"
                            );
                            updateSearchEngineButtons();
                        }
                    );
                }

                if (braveButton) {
                    braveButton.addEventListener(
                        "click",
                        () => {
                            localStorage.setItem(
                                SEARCH_ENGINE_STORAGE_KEY,
                                "brave"
                            );
                            updateSearchEngineButtons();
                        }
                    );
                }

                updateSearchEngineButtons();

            }
        );

    </script>

                icon: "https://cdn.edmodo.com/favicon.ico"
            }

        const cloakPreset =
            document.getElementById(
                "cloakPreset"
            );


        if (cloakPreset) {

            cloakPreset.addEventListener(
                "change",
                function () {

                    const val =
                        this.value;


                    if (presets[val]) {

                        document.getElementById(
                            "titleInput"
                        ).value =
                            presets[val].title;


                        document.getElementById(
                            "iconInput"
                        ).value =
                            presets[val].icon;


                        applyCloak();

                    }

                }
            );

        }


        function applyCloak() {

            const title =
                document.getElementById(
                    "titleInput"
                ).value;


            const icon =
                document.getElementById(
                    "iconInput"
                ).value;


            if (title) {

                document.title =
                    title;


                localStorage.setItem(
                    "cloakTitle",
                    title
                );

            }


            if (icon) {

                let link =
                    document.querySelector(
                        "link[rel~='icon']"
                    );


                if (!link) {

                    link =
                        document.createElement(
                            "link"
                        );

                    link.rel = "icon";

                    document.head.appendChild(
                        link
                    );

                }


                link.href =
                    icon;


                localStorage.setItem(
                    "cloakIcon",
                    icon
                );

            }

        }


        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const title =
                    localStorage.getItem(
                        "cloakTitle"
                    );


                const icon =
                    localStorage.getItem(
                        "cloakIcon"
                    );


                if (title) {

                    document.title =
                        title;


                    document.getElementById(
                        "titleInput"
                    ).value =
                        title;

                }


                if (icon) {

                    document.getElementById(
                        "iconInput"
                    ).value =
                        icon;


                    const link =
                        document.querySelector(
                            "link[rel~='icon']"
                        );


                    if (link) {

                        link.href =
                            icon;

                    }

                }

            }
        );

    </script>


    <!-- =========================
         ABOUT:BLANK
    ========================= -->

    <script>

        function openBlank() {

            const win =
                window.open(
                    "about:blank",
                    "_blank"
                );


            if (!win) {

                alert(
                    "Popup blocked"
                );

                return;

            }


            const iframe =
                win.document.createElement(
                    "iframe"
                );


            iframe.style.width =
                "100%";

            iframe.style.height =
                "100%";

            iframe.style.border =
                "none";


            iframe.src =
                location.href;


            win.document.body.style.margin =
                "0";


            win.document.body.appendChild(
                iframe
            );

        }

    </script>


    <!-- =========================
         PRIVACY / INACTIVE TAB
    ========================= -->

    <script>

        const inactiveOverlay =
            document.getElementById(
                "inactiveOverlay"
            );


        function updateInactiveOverlay() {

            if (document.hidden) {

                inactiveOverlay.classList.add(
                    "active"
                );

            }

            else {

                inactiveOverlay.classList.remove(
                    "active"
                );

            }

        }


        document.addEventListener(
            "visibilitychange",
            updateInactiveOverlay
        );


        window.addEventListener(
            "blur",
            () => {

                inactiveOverlay.classList.add(
                    "active"
                );

            }
        );


        window.addEventListener(
            "focus",
            () => {

                if (!document.hidden) {

                    inactiveOverlay.classList.remove(
                        "active"
                    );

                }

            }
        );


        updateInactiveOverlay();

    </script>
